name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -maxdepth 4 | head -n  1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          
          # Creamos un archivo local.properties vacío para evitar que falle buscando rutas
          touch local.properties
          
          # Compilamos pasando parámetros para evitar variables vacías
          ./gradlew assembleDebug -Pandroid.defaults.buildfeatures.buildconfig=true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileAgent-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
