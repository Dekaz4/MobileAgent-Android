name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix gradle config and Build
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -maxdepth 4 | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          
          # Parcheamos el archivo build.gradle.kts problemático para eliminar la línea de la ruta vacía
          find . -name "build.gradle.kts" -exec sed -i '/path/d' {} +
          
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileAgent-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
