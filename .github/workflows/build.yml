name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Patch Gradle and Build
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -maxdepth 4 | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          
          # Localizamos el archivo build.gradle.kts de la app y eliminamos la línea que da error
          GRADLE_FILE=$(find . -path "*/app/build.gradle.kts" | head -n 1)
          if [ -f "$GRADLE_FILE" ]; then
            echo "=> Parcheando $GRADLE_FILE"
            # Reemplazamos cualquier asignación de path vacía por una cadena dummy válida
            sed -i 's/path\s*=\s*""/path = "."/g' "$GRADLE_FILE"
            sed -i "s/path\s*=\s*''/path = '.'/g" "$GRADLE_FILE"
            # Si hay alguna línea con path vacío sin comillas explícitas
            sed -i '/path\s*=\s*$/d' "$GRADLE_FILE"
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileAgent-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
